        INFOPLIST_KEY_UILaunchScreen_Generation: true
        SUPPORTS_MACCATALYST: false
  VAL1DeviceDriverUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: VAL1DeviceDriver
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wiseeating.validation.VAL1DeviceDriverUITests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: VAL1DeviceDriver
        SUPPORTS_MACCATALYST: false
