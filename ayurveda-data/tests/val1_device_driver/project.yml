    DEVELOPMENT_TEAM: 8293TNMX6S
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
targets:
  VAL1DeviceDriver:
    type: application
    platform: iOS
    sources:
      - path: Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wiseeating.validation.VAL1DeviceDriver
